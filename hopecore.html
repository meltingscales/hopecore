<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopecore Tracker</title>
<meta name="description" content="Hope grounded in evidence: a sourced tracker of AI-driven progress from today to 2040.">
<style>
:root{
  --bg:#faf8f4;--surface:#ffffff;--surface-2:#f2efe8;--text:#1d1c1a;--muted:#65625c;--border:#e2ded5;--accent:#2f6f5e;
  --s-confirmed:#1f7a4d;--s-early:#1f7a4d;--s-on-track:#2a62b8;--s-pending:#6b6f76;--s-slipping:#a86400;--s-missed:#b3261e;--s-superseded:#8d8f93;
  --sev-high:#b3261e;--sev-medium:#a86400;--sev-low:#6b6f76;
  --chart:#2f6f5e;--grid:#e6e2d9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--surface:#1d1d1a;--surface-2:#262622;--text:#ecebe6;--muted:#a3a097;--border:#34332e;--accent:#6cc3a8;
  --s-confirmed:#4cc38a;--s-early:#4cc38a;--s-on-track:#6ea4f0;--s-pending:#9a9ea5;--s-slipping:#e0a040;--s-missed:#f07167;--s-superseded:#7c7e82;
  --sev-high:#f07167;--sev-medium:#e0a040;--sev-low:#9a9ea5;--chart:#6cc3a8;--grid:#2e2d29;
}}
:root[data-theme="dark"]{
  --bg:#141412;--surface:#1d1d1a;--surface-2:#262622;--text:#ecebe6;--muted:#a3a097;--border:#34332e;--accent:#6cc3a8;
  --s-confirmed:#4cc38a;--s-early:#4cc38a;--s-on-track:#6ea4f0;--s-pending:#9a9ea5;--s-slipping:#e0a040;--s-missed:#f07167;--s-superseded:#7c7e82;
  --sev-high:#f07167;--sev-medium:#e0a040;--sev-low:#9a9ea5;--chart:#6cc3a8;--grid:#2e2d29;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 ui-serif,Georgia,"Iowan Old Style",serif}
.sans,h1,h2,h3,.chip,.tile,.meta,button,select,.kicker,table{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.hero{padding:48px 0 24px;border-bottom:1px solid var(--border)}
.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);font-weight:600}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:8px 0 12px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 8px}
.lede{font-size:clamp(17px,2.2vw,20px);max-width:820px;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:12px}
section{padding:36px 0;border-bottom:1px solid var(--border)}
.sec-sub{color:var(--muted);margin:0 0 18px;font-size:15px}
sup.src{font-size:10px;font-family:ui-sans-serif,system-ui,sans-serif;margin-left:1px}
sup.src a{text-decoration:none;padding:0 1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.tile[data-s] .v{color:var(--sc)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.chart-card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chart-card .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;font-family:ui-sans-serif,system-ui,sans-serif}
.chart-card .delta{font-size:12px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif}
.chart-card .name{font-size:14px;font-weight:600;font-family:ui-sans-serif,system-ui,sans-serif;margin:0 0 4px}
.chart-card svg{width:100%;height:auto;display:block;margin:6px 0}
.chart-card .note{font-size:13px;color:var(--muted)}
.dom-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,transparent);white-space:nowrap}
[data-s="confirmed"]{--sc:var(--s-confirmed)}[data-s="early"]{--sc:var(--s-early)}[data-s="on-track"]{--sc:var(--s-on-track)}[data-s="pending"]{--sc:var(--s-pending)}[data-s="slipping"]{--sc:var(--s-slipping)}[data-s="missed"]{--sc:var(--s-missed)}[data-s="superseded"]{--sc:var(--s-superseded)}
.pred.superseded .ptext{text-decoration:line-through;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.year{flex:0 0 230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;scroll-snap-align:start}
.year h3{font-size:20px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:baseline}
.year h3 small{font-size:12px;color:var(--muted);font-weight:500}
.year.now{border-color:var(--accent)}
details.pred{border-top:1px solid var(--border);padding:8px 0}
details.pred:first-of-type{border-top:0}
details.pred summary{cursor:pointer;list-style:none}
details.pred summary::-webkit-details-marker{display:none}
details.pred summary .ptext{display:block;font-size:14px;margin-top:4px;line-height:1.4}
details.pred summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.phist{font-size:13px;color:var(--muted);margin:8px 0 0;padding-left:16px}
.phist li{margin-bottom:4px}
.conf{font-size:11px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;margin-left:4px}
.domains{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.domain h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.domain .counts{display:flex;gap:4px;flex-wrap:wrap}
.domain h3{margin-top:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ms{margin:0;padding:0;list-style:none}
.ms li{padding:8px 0;border-top:1px solid var(--border)}
.ms li:first-child{border-top:0}
.ms .d{font-size:12px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ms .t{font-weight:600;font-size:15px}
.ms .s{font-size:14px;margin:2px 0 0}
.badge{font-size:10.5px;font-family:ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:4px;white-space:nowrap}
.badge.first{border-color:var(--s-confirmed);color:var(--s-confirmed)}
.roadblocks{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:6px}
.rb{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--border)}
.rb:first-of-type{border-top:0}
.rb .sev{font-size:11px;font-weight:700;font-family:ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;color:var(--sv);white-space:nowrap}
.rb .rt{font-weight:600;font-size:14px}
.rb .rs{grid-column:2;font-size:13px;color:var(--muted)}
.rb .tr{font-size:12px;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);white-space:nowrap}
[data-sev="high"]{--sv:var(--sev-high)}[data-sev="medium"]{--sv:var(--sev-medium)}[data-sev="low"]{--sv:var(--sev-low)}
.read{font-size:15px;margin:6px 0 0}
details.more>summary{cursor:pointer;font-size:13px;color:var(--accent);font-family:ui-sans-serif,system-ui,sans-serif;padding:6px 0}
.proved{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proved .card{border:1px solid var(--s-confirmed);background:linear-gradient(160deg,color-mix(in srgb,var(--s-confirmed) 12%,var(--surface)),var(--surface) 60%)}
.proved .yrs{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700;color:var(--s-confirmed);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.proved .pt{font-size:18px;font-weight:600;margin:6px 0}
.reality{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{color:var(--muted);font-style:italic}
.changelog details{border-top:1px solid var(--border);padding:10px 0}
.changelog summary{cursor:pointer;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600}
.changelog ul{font-size:14px;color:var(--muted)}
footer{padding:36px 0 60px;font-size:14px}
footer ol{padding-left:22px;font-size:13px;color:var(--muted)}
footer ol li{margin-bottom:4px;word-break:break-word}
footer ol li:target{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px}
.disclaimer{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:14px 0}
.domains>*,.reality>*,.charts>*,.proved>*,.tiles>*{min-width:0}
section,header.hero,footer{min-width:0;max-width:100%}
.fade{animation:fadein .8s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:720px){
  .domains,.reality,.charts,.proved{grid-template-columns:minmax(0,1fr)}
  header.hero{padding-top:28px}
  .year{flex-basis:78vw}
}
</style>
</head>

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("hopecore-data").textContent);
var app = document.getElementById("app");

var STATUS = {
  "confirmed":  {label:"Confirmed", icon:"✓"},
  "early":      {label:"Early",     icon:"★"},
  "on-track":   {label:"On track",  icon:"→"},
  "pending":    {label:"Pending",   icon:"○"},
  "slipping":   {label:"Slipping",  icon:"!"},
  "missed":     {label:"Missed",    icon:"✕"},
  "superseded": {label:"Superseded",icon:"–"}
};
var TREND = {"worsening":"↑ worsening","stable":"→ stable","easing":"↓ easing"};
var DOMAINS = D.domains || [];
var domName = {}; DOMAINS.forEach(function(d){ domName[d.id] = d.name; });

// source index numbers follow ledger order
var srcIndex = {}; D.sources.forEach(function(s,i){ srcIndex[s.id] = i+1; });

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function sup(ids){
  if(!ids || !ids.length) return "";
  return '<sup class="src">' + ids.map(function(id){
    var s = D.sources.find(function(x){return x.id===id;});
    if(!s) return "";
    return '<a href="#'+esc(id)+'" title="'+esc(s.publisher+": "+s.title)+'">['+srcIndex[id]+']</a>';
  }).join("") + '</sup>';
}
function chip(status){
  var m = STATUS[status] || STATUS.pending;
  return '<span class="chip" data-s="'+esc(status)+'"><span aria-hidden="true">'+m.icon+'</span>'+m.label+'</span>';
}
function parseDate(s){
  if(!s) return NaN;
  var p = String(s).split("-").map(Number);
  return Date.UTC(p[0], (p[1]||7)-1, p[2]||(p[1]?15:1));
}
function fmtDate(s){
  if(!s) return "";
  var p = String(s).split("-");
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if(p.length===1) return p[0];
  if(p.length===2) return M[+p[1]-1]+" "+p[0];
  return M[+p[1]-1]+" "+(+p[2])+", "+p[0];
}
function fmtNum(v){
  var a = Math.abs(v);
  if(a>=10000) return Math.round(v/1000).toLocaleString("en-US")+"k";
  if(a>=100) return Math.round(v).toLocaleString("en-US");
  if(a>=10) return (Math.round(v*10)/10).toString();
  return (Math.round(v*100)/100).toString();
}
function unitStr(v,u){
  var n = fmtNum(v);
  if(u==="%") return n+"%";
  if(u==="x") return n+"×";
  if(u==="$/kWh") return "$"+n+"/kWh";
  if(u==="index") return n;
  return n+" "+u;
}

var year0 = Number(D.meta.last_run.slice(0,4));
var preds = D.predictions;
function count(st, list){ return (list||preds).filter(function(p){return p.status===st;}).length; }

// ---------- HERO ----------
var html = '';
html += '<header class="hero"><div class="kicker">Hope grounded in evidence</div>'
  + '<h1>Hopecore: AI progress tracker, YTD → 2040</h1>'
  + '<p class="lede">'+esc(D.meta.summary)+sup(D.meta.summary_source_ids)+'</p>'
  + '<div class="meta num">Last updated: <strong>'+esc(D.meta.last_run)+'</strong> · Run #'+D.meta.run_count
  + ' · '+preds.length+' predictions · '+D.milestones.length+' milestones · '+D.sources.length+' sources</div></header>';

// ---------- SCORECARD ----------
var due = preds.filter(function(p){ return p.year <= year0 || p.status==="early" || p.status==="confirmed" || p.status==="missed"; });
var hits = count("confirmed",due)+count("early",due), misses = count("missed",due);
var hitRate = (hits+misses) ? Math.round(100*hits/(hits+misses))+"%" : "—";
var newMs = D.milestones.filter(function(m){ return m.added===D.meta.last_run; }).length;
html += '<section aria-labelledby="sc"><h2 id="sc">Scorecard</h2><p class="sec-sub">Hit rate = (confirmed + early) ÷ (confirmed + early + missed), among predictions that are resolved or whose target year has arrived.</p><div class="tiles">';
[["confirmed","Confirmed"],["early","Early"],["on-track","On track"],["slipping","Slipping"],["missed","Missed"],["pending","Pending"]].forEach(function(t){
  html += '<div class="tile" data-s="'+t[0]+'"><div class="v">'+count(t[0])+'</div><div class="l"><span aria-hidden="true">'+STATUS[t[0]].icon+'</span> '+t[1]+'</div></div>';
});
html += '<div class="tile"><div class="v">'+hitRate+'</div><div class="l">Hit rate'+(hits+misses?' ('+hits+'/'+(hits+misses)+')':' (none resolved by deadline yet)')+'</div></div>';
html += '<div class="tile"><div class="v">'+newMs+'</div><div class="l">New milestones this run</div></div>';
html += '</div></section>';

// ---------- METRICS ----------
function chart(m){
  var W=300,H=110,pl=4,pr=4,pt=8,pb=18;
  var s = m.series.slice().sort(function(a,b){return parseDate(a.date)-parseDate(b.date);});
  var xs = s.map(function(p){return parseDate(p.date);}), ys = s.map(function(p){return p.value;});
  var lg = !!m.log;
  var f = lg ? function(v){return Math.log10(v);} : function(v){return v;};
  var ymin = Math.min.apply(null, ys.map(f)), ymax = Math.max.apply(null, ys.map(f));
  if(!lg){ ymin = Math.min(0, ymin); }
  if(ymax===ymin){ ymax = ymin + (lg?1:Math.abs(ymin)||1); }
  var pad=(ymax-ymin)*0.08; ymax+=pad; if(lg) ymin-=pad;
  var xmin = Math.min.apply(null,xs), xmax = Math.max.apply(null,xs);
  if(xmax===xmin){ xmin-=86400000*60; xmax+=86400000*60; }
  function X(t){ return pl + (t-xmin)/(xmax-xmin)*(W-pl-pr); }
  function Y(v){ return pt + (1-(f(v)-ymin)/(ymax-ymin))*(H-pt-pb); }
  var o = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(m.name)+' over time'+(lg?' (log scale)':'')+'">';
  o += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--grid)"/>';
  o += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'" stroke="var(--grid)" stroke-dasharray="2 3"/>';
  if(s.length>1){
    o += '<polyline fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" points="'+s.map(function(p){return X(parseDate(p.date)).toFixed(1)+","+Y(p.value).toFixed(1);}).join(" ")+'"/>';
  }
  s.forEach(function(p,i){
    var x=X(parseDate(p.date)), y=Y(p.value);
    o += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i===s.length-1?4:3)+'" fill="'+(i===s.length-1?'var(--chart)':'var(--surface)')+'" stroke="var(--chart)" stroke-width="2"><title>'+esc(fmtDate(p.date)+": "+unitStr(p.value,m.unit)+(p.note?" — "+p.note:""))+'</title></circle>';
  });
  o += '<text x="'+pl+'" y="'+(H-4)+'" font-size="10" fill="var(--muted)" font-family="system-ui,sans-serif">'+esc(fmtDate(s[0].date))+'</text>';
  if(s.length>1) o += '<text x="'+(W-pr)+'" y="'+(H-4)+'" font-size="10" fill="var(--muted)" text-anchor="end" font-family="system-ui,sans-serif">'+esc(fmtDate(s[s.length-1].date))+'</text>';
  if(lg) o += '<text x="'+(W/2)+'" y="'+(H-4)+'" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="system-ui,sans-serif">log scale</text>';
  o += '</svg>';
  return o;
}
html += '<section aria-labelledby="hm"><h2 id="hm">Headline metrics</h2><p class="sec-sub">Hover or tap points for notes. Where sources disagree, the more conservative number is charted.</p><div class="charts">';
D.metrics.forEach(function(m){
  var s = m.series.slice().sort(function(a,b){return parseDate(a.date)-parseDate(b.date);});
  var last = s[s.length-1], prev = s.length>1 ? s[s.length-2] : null;
  var delta = prev ? (last.value-prev.value) : null;
  var dtxt = prev ? ((delta>=0?"+":"−")+fmtNum(Math.abs(delta))+(m.unit==="%"?" pts":"")+" since "+fmtDate(prev.date)) : "first data point";
  var allSrc = []; s.forEach(function(p){ p.source_ids.forEach(function(id){ if(allSrc.indexOf(id)<0) allSrc.push(id); }); });
  html += '<div class="card chart-card"><span class="dom-tag">'+esc(domName[m.domain]||m.domain)+'</span><p class="name">'+esc(m.name)+'</p>'
    + '<div class="top"><span class="big">'+esc(unitStr(last.value,m.unit))+'</span><span class="delta num">'+esc(dtxt)+'</span></div>'
    + chart(m) + '<div class="note">'+esc(m.trend_note)+sup(allSrc)+'</div>'
    + (last.note?'<div class="note" style="margin-top:4px"><em>Latest: '+esc(last.note)+'</em></div>':'')
    + '</div>';
});
html += '</div></section>';

// ---------- TIMELINE ----------
function predDetails(p, showDomain){
  var hist = p.history.slice().reverse().map(function(h){
    return '<li><span class="num">'+esc(h.date)+'</span> · '+chip(h.status)+' '+esc(h.reason)+sup(h.source_ids)+'</li>';
  }).join("");
  return '<details class="pred '+esc(p.status)+'" data-domain="'+esc(p.domain)+'"><summary>'+chip(p.status)
    + '<span class="conf">'+esc(p.confidence)+' confidence'+(p.years_early?' · '+p.years_early+' yr early':'')+'</span>'
    + (showDomain?' <span class="dom-tag">'+esc(domName[p.domain]||p.domain)+'</span>':'')
    + '<span class="ptext">'+esc(p.text)+'</span></summary>'
    + '<div class="sans" style="font-size:12px;color:var(--muted);margin-top:6px">Target '+p.year+' · kind: '+esc(p.kind)+' · origin: '+esc(p.origin)+(p.revises?' · revises '+esc(p.revises):'')+'</div>'
    + '<ul class="phist">'+hist+'</ul></details>';
}
var lastYear = 2040;
html += '<section aria-labelledby="tl"><h2 id="tl">The 2040 timeline</h2><p class="sec-sub">Scroll sideways. Tap a prediction to see its grading history and sources.</p>';
html += '<div class="filters" role="group" aria-label="Filter by domain"><button type="button" data-f="all" aria-pressed="true">All</button>'
  + DOMAINS.map(function(d){ return '<button type="button" data-f="'+esc(d.id)+'" aria-pressed="false">'+esc(d.name.split(" & ")[0].split(" (")[0])+'</button>'; }).join("") + '</div>';
html += '<div class="timeline" id="timeline">';
for(var y=year0; y<=lastYear; y++){
  var ps = preds.filter(function(p){return p.year===y;});
  html += '<div class="year'+(y===year0?' now':'')+'"><h3>'+y+'<small>'+(y===year0?'now':ps.length+' prediction'+(ps.length===1?'':'s'))+'</small></h3>';
  html += ps.length ? ps.map(function(p){return predDetails(p,true);}).join("") : '<p class="empty" style="font-size:13px">No predictions due.</p>';
  html += '</div>';
}
html += '</div></section>';

// ---------- DOMAIN CARDS ----------
html += '<section aria-labelledby="dc"><h2 id="dc">Domains</h2><p class="sec-sub">Each card shows wins and roadblocks side by side. Labels: capability = it can be done, deployment = in real use, impact = measurably changed outcomes.</p><div class="domains">';
DOMAINS.forEach(function(d){
  var ms = D.milestones.filter(function(m){return m.domain===d.id;}).sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var dp = preds.filter(function(p){return p.domain===d.id;}).sort(function(a,b){return a.year-b.year;});
  var rbs = D.roadblocks.filter(function(r){return r.domain===d.id;});
  var sevOrder = {high:0,medium:1,low:2}; rbs.sort(function(a,b){return sevOrder[a.severity]-sevOrder[b.severity];});
  function msLi(m){
    return '<li><div class="d">'+esc(fmtDate(m.date))+'<span class="badge">'+esc(m.kind)+'</span><span class="badge'+(m.significance==="first-ever"?' first':'')+'">'+esc(m.significance)+'</span></div>'
      + '<div class="t">'+esc(m.title)+sup(m.source_ids)+'</div><p class="s">'+esc(m.summary)+'</p></li>';
  }
  var counts = ["early","confirmed","on-track","slipping","missed"].filter(function(s){return count(s,dp);}).map(function(s){return '<span class="chip" data-s="'+s+'"><span aria-hidden="true">'+STATUS[s].icon+'</span>'+count(s,dp)+' '+STATUS[s].label.toLowerCase()+'</span>';}).join("");
  html += '<article class="card domain" id="d-'+esc(d.id)+'"><h2>'+esc(d.name)+'</h2><div class="counts">'+counts+'</div>';
  html += '<h3>Realistic read</h3><p class="read">'+esc(d.read)+'</p>';
  html += '<h3>Latest milestones</h3>' + (ms.length ? '<ul class="ms">'+ms.slice(0,5).map(msLi).join("")+'</ul>' + (ms.length>5?'<details class="more"><summary>Show '+(ms.length-5)+' more</summary><ul class="ms">'+ms.slice(5).map(msLi).join("")+'</ul></details>':'') : '<p class="empty">No milestones recorded yet.</p>');
  html += '<h3>Roadblocks</h3><div class="roadblocks">' + (rbs.length ? rbs.map(function(r){
    return '<div class="rb" data-sev="'+esc(r.severity)+'"><span class="sev">'+esc(r.severity)+'</span><span class="rt">'+esc(r.title)+sup(r.source_ids)+' <span class="tr">'+esc(TREND[r.trend]||r.trend)+'</span></span><span class="rs">'+esc(r.summary)+'</span></div>';
  }).join("") : '<p class="empty">No roadblocks recorded.</p>') + '</div>';
  html += '<h3>Predictions</h3>' + dp.map(function(p){ return predDetails(p,false).replace('<span class="conf">','<span class="conf"><strong class="num">'+p.year+'</strong> · '); }).join("");
  html += '</article>';
});
html += '</div></section>';

// ---------- PROVED WALL ----------
var proved = preds.filter(function(p){return p.status==="confirmed"||p.status==="early";});
html += '<section aria-labelledby="pw"><h2 id="pw">The news proved it</h2><p class="sec-sub">Predictions that came true, with the evidence that settled them.</p>';
if(proved.length){
  html += '<div class="proved">' + proved.map(function(p){
    var h = p.history.filter(function(x){return x.status===p.status;}).slice(-1)[0] || p.history[p.history.length-1];
    var ms = D.milestones.filter(function(m){return (m.confirms_prediction_ids||[]).indexOf(p.id)>=0;});
    return '<div class="card fade">'+chip(p.status)+' <span class="yrs">'+(p.status==="early"&&p.years_early?p.years_early+' year'+(p.years_early>1?'s':'')+' early':'on time')+'</span>'
      + '<p class="pt">'+esc(p.text)+'</p>'
      + '<p class="sans" style="font-size:13px;color:var(--muted);margin:0 0 6px">Predicted for '+p.year+' · graded '+esc(h.date)+'</p>'
      + ms.map(function(m){return '<p style="margin:0 0 6px"><strong>'+esc(fmtDate(m.date))+':</strong> '+esc(m.title)+sup(m.source_ids)+'</p>';}).join("")
      + '<p style="font-size:14px;margin:0">'+esc(h.reason)+sup(h.source_ids)+'</p></div>';
  }).join("") + '</div>';
} else { html += '<p class="empty">Nothing confirmed yet. Check back.</p>'; }
html += '</section>';

// ---------- REALITY CHECK ----------
var bigRb = D.roadblocks.filter(function(r){return r.severity==="high" || r.trend==="worsening";});
var lastLog = D.changelog[D.changelog.length-1];
var bad = preds.filter(function(p){
  return (p.status==="slipping"||p.status==="missed") && p.history.some(function(h){return h.date===D.meta.last_run && (h.status==="slipping"||h.status==="missed");});
});
html += '<section aria-labelledby="rc"><h2 id="rc">Reality check</h2><p class="sec-sub">The biggest headwinds right now, and predictions that slipped or were missed this run.</p><div class="reality">';
html += '<div class="card"><h3>Biggest roadblocks (high severity or worsening)</h3><div class="roadblocks" style="background:none;padding:0">' + bigRb.map(function(r){
  return '<div class="rb" data-sev="'+esc(r.severity)+'"><span class="sev">'+esc(r.severity)+'</span><span class="rt">'+esc(r.title)+sup(r.source_ids)+' <span class="tr">'+esc(TREND[r.trend])+'</span></span><span class="rs"><span class="dom-tag">'+esc(domName[r.domain])+'</span> · '+esc(r.summary)+'</span></div>';
}).join("") + '</div></div>';
html += '<div class="card"><h3>Slipped or missed this run</h3>' + (bad.length ? bad.map(function(p){return predDetails(p,true);}).join("") : '<p class="empty">None.</p>') + '</div>';
html += '</div></section>';

// ---------- CHANGELOG ----------
html += '<section class="changelog" aria-labelledby="cl"><h2 id="cl">Changelog</h2>';
D.changelog.slice().reverse().forEach(function(c,i){
  html += '<details'+(i===0?' open':'')+'><summary class="num">'+esc(c.date)+' — '+c.status_changes.length+' status change'+(c.status_changes.length===1?'':'s')+'</summary><p>'+esc(c.summary)+'</p>'
    + (c.status_changes.length?'<ul>'+c.status_changes.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul>':'') + '</details>';
});
html += '</section>';

// ---------- FOOTER ----------
html += '<footer><h2>Method</h2>'
  + '<p>Every prediction has one status: <strong>confirmed</strong> (happened as stated by the target year), <strong>early</strong> (confirmed before it), <strong>on track</strong> (measured progress at the needed pace), <strong>pending</strong> (not enough evidence), <strong>slipping</strong> (real but behind pace), <strong>missed</strong> (target year passed) or <strong>superseded</strong> (the question stopped making sense). Announcements, plans and targets never count as confirmation. Confirmed or missed needs one primary source or two independent secondary sources. Predictions are never deleted or reworded; revisions are added as new entries. Confidence is the tracker\'s current judgment that the prediction will be met by its target year.</p>'
  + '<div class="disclaimer"><strong>Not financial or medical advice.</strong> Drug and device statuses are reported as regulators state them; nothing listed as investigational or pending is available as an approved treatment. Talk to a clinician about any medical decision.</div>'
  + '<h2>Sources</h2><ol>' + D.sources.map(function(s){
    return '<li id="'+esc(s.id)+'">'+esc(s.publisher)+'. <a href="'+esc(s.url)+'" rel="noopener noreferrer">'+esc(s.title)+'</a>. Published '+esc(s.published)+', accessed '+esc(s.accessed)+'. <span class="badge">'+esc(s.type)+'</span></li>';
  }).join("") + '</ol>'
  + '<p class="meta">Rendered entirely from the ledger embedded in this file. Run #'+D.meta.run_count+', created '+esc(D.meta.created)+'.</p>'
  + '<p class="meta">Source code: <a href="https://github.com/meltingscales/hopecore" rel="noopener noreferrer">github.com/meltingscales/hopecore</a></p></footer>';

app.innerHTML = html;

// domain filter for timeline
var btns = app.querySelectorAll(".filters button");
btns.forEach(function(b){
  b.addEventListener("click", function(){
    var f = b.getAttribute("data-f");
    btns.forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); });
    app.querySelectorAll("#timeline details.pred").forEach(function(el){
      el.hidden = !(f==="all" || el.getAttribute("data-domain")===f);
    });
  });
});
})();
</script>
</body>
</html>
